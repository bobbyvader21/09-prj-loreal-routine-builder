<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oréal" class="logo" />
        <h1 class="site-title">Smart Routine &amp; Product Advisor</h1>
      </header>

      <main>
        <!-- Category filter and product cards -->
        <div class="search-section">
          <label for="categoryFilter" class="visually-hidden">
            Product category
          </label>
          <select id="categoryFilter">
            <option value="" disabled selected>Choose a Category</option>
            <option value="cleanser">Cleansers</option>
            <option value="moisturizer">Moisturizers &amp; Treatments</option>
            <option value="haircare">Haircare</option>
            <option value="makeup">Makeup</option>
            <option value="hair color">Hair Color</option>
            <option value="hair styling">Hair Styling</option>
            <option value="men's grooming">Men's Grooming</option>
            <option value="suncare">Suncare</option>
            <option value="fragrance">Fragrance</option>
          </select>
        </div>

        <div id="productsContainer" class="products-grid"></div>

        <!-- Selected products and routine generation -->
        <section class="selected-products" aria-labelledby="selectionHeading">
          <div class="selection-heading">
            <h2 id="selectionHeading">
              Selected Products <span id="selectedCount"></span>
            </h2>
            <button
              id="clearSelections"
              class="text-button"
              type="button"
              disabled
            >
              Clear all
            </button>
          </div>

          <ul id="selectedProductsList" aria-label="Selected products"></ul>

          <button
            id="generateRoutine"
            class="generate-btn"
            type="button"
            disabled
          >
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            Generate Routine
          </button>
        </section>

        <!-- Generated routine and follow-up chat -->
        <section class="chatbox" aria-labelledby="chatHeading">
          <h2 id="chatHeading">Let's Build Your Routine</h2>

          <div
            id="chatWindow"
            class="chat-window"
            role="log"
            aria-label="Routine conversation"
            tabindex="0"
          ></div>

          <p id="chatStatus" class="chat-status" role="status"></p>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
              disabled
            />
            <button id="sendBtn" type="submit" disabled>
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav aria-label="Footer links">
          <!-- Replace these placeholder URLs with the final links. -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
